services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      # 需要大模型时再打开下面三行（不要把真实 key 写进仓库）
      # LLM_BASE_URL: https://api.deepseek.com/v1
      # LLM_API_KEY: ${LLM_API_KEY}
      # LLM_MODEL: deepseek-chat
      # GUARDIAN_WEBHOOK: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx
    volumes:
      - ../data:/app/data
      - ../app/kb:/app/app/kb:ro
    restart: unless-stopped
