[project]
name = "a30-fraud-assistant"
version = "0.1.0"
description = "A30 多模态反诈智能助手 —— 赛题骨架（规则可跑，模型可插）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008：FastAPI 的 File(...)/Depends(...) 就是写在默认值里的，属官方用法
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
